<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MeetYourTribe</title>

    <link rel="stylesheet" href="/static/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-left">

            <div class="brand">
                <div class="logo-icon">M</div>
                <span>MeetYourTribe</span>
            </div>

            <div class="auth-subtitle">START FOR FREE</div>

            <h1 class="auth-title">
                Create your <span>Profile.</span>
            </h1>

            <p class="auth-description">
                Tell us about yourself so AI can match you with the right attendees, conversations, and opportunities.
            </p>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Log in</a>
            </p>

            <form class="auth-form" id="signupForm">

                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="fullName" placeholder="Full Name" required>
                    </div>

                    <div class="input-group">
                        <input type="text" id="company" placeholder="Company / Organization" required>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="jobTitle" placeholder="Job Title" required>
                </div>

                <div class="input-group">
                    <textarea id="bio" placeholder="Bio (short description of your background and focus)" required></textarea>
                </div>

                <div class="input-group">
                    <input type="text" id="interests" placeholder="Interests (comma-separated keywords)" required>
                </div>

                <div class="input-group">
                    <input type="text" id="techNeeds" placeholder="Technology Needs (tools / solutions you're looking for)" required>
                </div>

                <div class="input-group">
                    <input type="text" id="lookingFor" placeholder="Looking For (who do you want to meet?)" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <div class="button-row">
                    <button type="submit" class="primary-btn">Create Account</button>

                    <button type="button" class="secondary-btn" onclick="window.location.href='/'">
                        Back Home
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    const payload = {
        name: document.getElementById("fullName").value,
        company: document.getElementById("company").value,
        job_title: document.getElementById("jobTitle").value,
        bio: document.getElementById("bio").value,
        interests: document.getElementById("interests").value,
        tech_needs: document.getElementById("techNeeds").value,
        looking_for: document.getElementById("lookingFor").value,
        email: document.getElementById("email").value,
        password: password
    };

    const response = await fetch("/api/signup", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    if (response.ok) {
        window.location.href = "/dashboard";
    } else {
        const data = await response.json();
        alert(data.detail || "Signup failed.");
    }
});
</script>

</body>
</html>
