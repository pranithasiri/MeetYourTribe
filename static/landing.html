<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetYourTribe</title>

    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/landing.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="landing-page">

    <header class="landing-header">
        <div class="brand">
            <div class="logo-icon">M</div>
            <span>MeetYourTribe</span>
        </div>

        <div class="header-actions">
            <a href="/login" class="secondary-btn">Login</a>
            <a href="/signup" class="primary-btn">Get Started</a>
        </div>
    </header>

    <section class="hero-section">

        <div class="hero-left">
            <div class="hero-badge">
                AI-Powered Conference Networking
            </div>

            <h1>
                Meet the <span>right people</span><br>
                at every event.
            </h1>

            <p>
                MeetYourTribe helps conference attendees discover relevant connections,
                schedule networking meetings, join topic groups, and generate smart AI follow-ups.
            </p>

            <div class="hero-buttons">
                <a href="/signup" class="primary-btn large-btn">Create Profile</a>
                <a href="/login" class="secondary-btn large-btn">Login</a>
            </div>
        </div>

        <div class="hero-right">
            <img src="/static/assets/hero.png" alt="Conference Networking">
        </div>

    </section>

</div>

</body>
</html>
